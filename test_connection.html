<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка Supabase подключения</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-top: 0;
        }
        .status {
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            font-weight: 500;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        button:hover {
            background: #0056b3;
        }
        .log {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 14px;
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Проверка подключения к Supabase</h1>
        <button onclick="checkConnection()">Проверить подключение</button>
        <div id="results"></div>
        <div id="log" class="log" style="display:none;"></div>
    </div>

    <script>
        const supabaseUrl = 'https://uygwegdngztmbpuhsdrl.supabase.co';
        const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV5Z3dlZ2RuZ3p0bWJwdWhzZHJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ1NjczODQsImV4cCI6MjA4MDE0MzM4NH0.TBDRNSOK8w6xh9OefGVqChzQn0Ab-xZ6wVJ7D_sCAEg';

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            logDiv.style.display = 'block';
            const time = new Date().toLocaleTimeString();
            logDiv.innerHTML += `<div>[${time}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function checkConnection() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="status info">⏳ Проверка подключения...</div>';
            document.getElementById('log').innerHTML = '';

            log('Инициализация Supabase клиента...');
            const supabase = supabaseJs.createClient(supabaseUrl, supabaseAnonKey);

            let allOk = true;
            const tables = ['sounds', 'theory_nodes', 'learning_nodes'];

            for (const table of tables) {
                try {
                    log(`Проверка таблицы "${table}"...`);
                    const { data, error } = await supabase.from(table).select('count').limit(1);
                    
                    if (error) {
                        if (error.message.includes('does not exist') || error.code === 'PGRST116' || error.code === '42P01') {
                            resultsDiv.innerHTML += `<div class="status error">❌ Таблица "${table}" НЕ существует</div>`;
                            log(`❌ Таблица "${table}" не найдена: ${error.message}`);
                            allOk = false;
                        } else {
                            resultsDiv.innerHTML += `<div class="status error">❌ "${table}": ${error.message}</div>`;
                            log(`❌ Ошибка "${table}": ${error.message}`);
                            allOk = false;
                        }
                    } else {
                        resultsDiv.innerHTML += `<div class="status success">✅ Таблица "${table}" существует!</div>`;
                        log(`✅ Таблица "${table}" найдена`);
                    }
                } catch (err) {
                    resultsDiv.innerHTML += `<div class="status error">❌ Ошибка при проверке "${table}": ${err.message}</div>`;
                    log(`❌ Исключение "${table}": ${err.message}`);
                    allOk = false;
                }
            }

            // Проверка Storage
            try {
                log('Проверка Storage buckets...');
                const { data, error } = await supabase.storage.listBuckets();
                if (error) {
                    resultsDiv.innerHTML += `<div class="status error">❌ Storage: ${error.message}</div>`;
                    log(`❌ Storage ошибка: ${error.message}`);
                    allOk = false;
                } else {
                    const buckets = data.map(b => b.name);
                    if (buckets.includes('sounds')) {
                        resultsDiv.innerHTML += `<div class="status success">✅ Storage bucket "sounds" существует!</div>`;
                        log(`✅ Bucket "sounds" найден`);
                    } else {
                        resultsDiv.innerHTML += `<div class="status error">❌ Storage bucket "sounds" НЕ существует</div>`;
                        log(`❌ Bucket "sounds" не найден`);
                        allOk = false;
                    }
                    log(`Доступные buckets: ${buckets.join(', ')}`);
                }
            } catch (err) {
                resultsDiv.innerHTML += `<div class="status error">❌ Storage ошибка: ${err.message}</div>`;
                log(`❌ Storage исключение: ${err.message}`);
                allOk = false;
            }

            if (allOk) {
                resultsDiv.innerHTML += `<div class="status success" style="margin-top:20px;font-size:18px;">🎉 Всё отлично! База данных настроена правильно!</div>`;
            } else {
                resultsDiv.innerHTML += `<div class="status error" style="margin-top:20px;font-size:18px;">⚠️ Некоторые таблицы отсутствуют. Нужно выполнить SQL скрипт.</div>`;
            }
        }
    </script>
</body>
</html>
